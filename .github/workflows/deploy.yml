name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_DIR: /opt/github-dashboard
  TARGET: root@${{ secrets.SSH_HOST }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check syntax
        run: node --check server.js && node --check public/app.js

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Upload code
        run: |
          rsync -az --delete \
            --exclude .git --exclude node_modules --exclude .env --exclude .cache \
            ./ "$TARGET:$APP_DIR/"

      - name: Write .env
        env:
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          BASE_URL: ${{ secrets.BASE_URL }}
        run: |
          printf 'GITHUB_CLIENT_ID=%s\nGITHUB_CLIENT_SECRET=%s\nSESSION_SECRET=%s\nBASE_URL=%s\n' \
            "$GITHUB_CLIENT_ID" "$GITHUB_CLIENT_SECRET" "$SESSION_SECRET" "$BASE_URL" \
            | ssh "$TARGET" "umask 077 && cat > $APP_DIR/.env && chown www-data $APP_DIR/.env"

      - name: Install and restart
        run: |
          ssh "$TARGET" "
            set -e
            cd $APP_DIR
            npm ci --omit=dev
            cp deploy/github-dashboard.service /etc/systemd/system/
            systemctl daemon-reload
            systemctl enable github-dashboard
            systemctl restart github-dashboard
            for i in \$(seq 10); do curl -fs localhost:4321/ > /dev/null && exit 0; sleep 1; done
            journalctl -u github-dashboard -n 30 --no-pager
            exit 1
          "
