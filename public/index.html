<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your PRs</title>
    <link id="favicon" rel="icon" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div class="who">
        <img id="avatar" alt="" />
        <h1>Your PRs</h1>
      </div>
      <div class="controls">
        <span id="status"></span>
        <button id="refresh" class="icon-button" type="button" title="Refresh" aria-label="Refresh"></button>
      </div>
    </header>

    <div id="summary" class="summary"></div>

    <div class="toolbar">
      <input id="filter" type="search" placeholder="Filter by title, repo, or author" />
      <div id="chips" class="chips" role="group" aria-label="Quick filters"></div>
      <button id="compact" class="chip" type="button" aria-pressed="false">Compact</button>
    </div>

    <main>
      <section data-section="mine">
        <div class="section-header">
          <h2>My PRs <span class="count"></span> <span class="unread-count"></span></h2>
          <button class="mark-all" type="button">Mark all as read</button>
        </div>
        <ul class="list"></ul>
      </section>
      <section data-section="reviewing">
        <div class="section-header">
          <h2>Reviewing <span class="count"></span> <span class="unread-count"></span></h2>
          <button class="mark-all" type="button">Mark all as read</button>
        </div>
        <ul class="list"></ul>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
